# Purpose: verify the visible thickness reference and reordered Settings, then release v0.6.4.
# Setup: runs only on the v0.6.4 development branch; native tests use disposable profiles.
# Writes: test artifacts; main/tag/release only after the publish marker and successful checks.
# Constraints: no personal browser/account/cart; matching and photograph data are unchanged.
name: Visible thickness reference verification
on:
  push:
    branches: [fix/visible-thickness-v0.6.4]
permissions:
  contents: write
concurrency:
  group: visible-reference-v064
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: |
          python -m pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Regression and package checks
        run: |
          npm test
          npm run check
          npm run package
          python scripts/verify-package.py
      - name: Native workspace and toolbar verification
        run: |
          python tests/v061-browser.py
          python tests/v063-layout-browser.py
          python scripts/verify-package.py
      - name: Preserve screenshots and installable ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-reference-v064
          path: |
            dist/
            test-results/
      - name: Publish verified v0.6.4
        if: hashFiles('.github/v064/PUBLISH') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./extension/manifest.json').version")" = 0.6.4
          python scripts/verify-package.py
          git diff --exit-code
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          gh release create v0.6.4 dist/Bullseye-Palette-Picker-v0.6.4.zip --target "$(git rev-parse HEAD)" --title 'Bullseye Palette Picker v0.6.4' --notes-file docs/release-v0.6.4.md
