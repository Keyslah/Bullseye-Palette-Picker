# Purpose: checkpoint and verify the requested landscape/alternatives update.
# Setup: fix/landscape-v0.6.1; numbered patches apply once to v0.6.0.
# Writes: source commits, test artifacts, and release only with PUBLISH marker.
# Constraints: no force pushes, no personal data or live shopping actions.
name: Verify layout v0.6.1
on:
  push:
    branches: [fix/landscape-v0.6.1]
permissions:
  contents: write
concurrency:
  group: layout-v061
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/landscape-v0.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply requested changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          stamps=Path('.github/v061/applied');stamps.mkdir(parents=True,exist_ok=True)
          for patch in sorted(Path('.github/v061').glob('*.py')):
              stamp=stamps/patch.name
              if stamp.exists():continue
              subprocess.run(['python',str(patch)],check=True)
              stamp.write_text('Applied. Test outcomes are in the workflow logs.\n')
          PY
      - name: Checkpoint before tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension tests docs README.md package.json .github/v061
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint v0.6.1 source before tests'
            git push origin HEAD:fix/landscape-v0.6.1
          fi
      - name: Code and catalog checks
        run: npm test && npm run check && npm run package
      - name: Native browser checks
        if: hashFiles('tests/v061-browser.py') != ''
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python tests/v061-browser.py
      - name: Preserve source and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-v061-workspace
          path: |
            extension/
            tests/
            scripts/
            docs/
            package.json
            README.md
            ATTRIBUTION.md
            PRIVACY.md
            LICENSE
            dist/
            test-results/
      - name: Publish v0.6.1
        if: hashFiles('.github/v061/PUBLISH') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./extension/manifest.json').version")" = 0.6.1
          test -f test-results/v061-report.json
          test -f docs/release-v0.6.1.md
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          gh release create v0.6.1 dist/Bullseye-Palette-Picker-v0.6.1.zip --target "$(git rev-parse HEAD)" --title 'Bullseye Palette Picker v0.6.1' --notes-file docs/release-v0.6.1.md
