# Purpose: verify reusable carts, independent alternatives and retained personal data, then release v0.6.7.
# Setup: the v0.6.7 development branch; browser checks use disposable profiles and store fixtures.
# Writes: test artifacts; main/tag/release only after successful checks and the publish marker.
# Constraints: no real customer session or live cart mutations; no force push.
name: Cart workflow and personal data verification
on:
  push:
    branches: [fix/cart-flow-v0.6.7]
permissions:
  contents: write
concurrency:
  group: cart-flow-v067
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: |
          python -m pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Regression and package checks
        run: |
          npm test
          npm run check
          npm run package
          python scripts/verify-package.py
      - name: Native workspace, shopping and personal data verification
        run: |
          python tests/v061-browser.py
          python tests/v063-layout-browser.py
          python tests/v065-matching-browser.py
          python tests/v067-alternatives-browser.py
          python tests/v067-cart-browser.py
          python tests/personal-data-browser.py
          python scripts/verify-package.py
      - name: Preserve screenshots and installable ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cart-flow-v067
          path: |
            dist/
            test-results/
      - name: Publish verified v0.6.7
        if: hashFiles('.github/v067/PUBLISH') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./extension/manifest.json').version")" = 0.6.7
          python scripts/verify-package.py
          git diff --exit-code
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          gh release create v0.6.7 dist/Bullseye-Palette-Picker-v0.6.7.zip --target "$(git rev-parse HEAD)" --title 'Bullseye Palette Picker v0.6.7' --notes-file docs/release-v0.6.7.md
          gh release download v0.6.7 --pattern Bullseye-Palette-Picker-v0.6.7.zip --dir test-results/published
          python scripts/verify-package.py test-results/published/Bullseye-Palette-Picker-v0.6.7.zip
